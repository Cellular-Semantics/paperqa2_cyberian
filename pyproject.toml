[project]
name = "paperqa2-cyberian"
version = "0.1.0"
description = "paperqa2 experiment using Cyberian/agentapi (codex) as the LLM backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "paper-qa>=2026.2.16",
    "httpx>=0.28",
    "pypdf[image]>=6.7.1",
    "sentence-transformers>=5.2.3",
]

[project.scripts]
retrieve-chunks = "paperqa2_cyberian.retrieve_chunks:main"
paperqa2-cyberian = "paperqa2_cyberian.main:main"
parse-jats-citations = "paperqa2_cyberian.parse_jats_citations:cli_main"
extract-asta-refs = "paperqa2_cyberian.extract_asta_refs:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that hit live EuropePMC (require network)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["paperqa2_cyberian*"]
